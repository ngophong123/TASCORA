<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1B"/>
      <stop offset="50%" stop-color="#0B1A3A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-ai-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#06B6D4" opacity="0.22" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="140" fill="#10B981" opacity="0.18" filter="url(#glow)"/>

  <!-- AI Processor Core Central -->
  <g filter="url(#soft-shadow)" transform="translate(240, 90)">
    <!-- Outer Silicon Frame -->
    <rect width="320" height="320" rx="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.96"/>
    <rect x="25" y="25" width="270" height="270" rx="20" fill="#09142A" stroke="#1E3A8A" stroke-width="1.5"/>

    <!-- Synaptic Network Graph -->
    <g transform="translate(160, 160)">
      <line x1="0" y1="0" x2="-75" y2="-60" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="75" y2="-60" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="-85" y2="60" stroke="#34D399" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="85" y2="60" stroke="#34D399" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-95" stroke="#60A5FA" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="95" stroke="#60A5FA" stroke-width="2"/>

      <line x1="-75" y1="-60" x2="0" y2="-95" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="75" y1="-60" x2="0" y2="-95" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="-85" y1="60" x2="0" y2="95" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="85" y1="60" x2="0" y2="95" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Peripheral Nodes -->
      <circle cx="-75" cy="-60" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="75" cy="-60" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="-85" cy="60" r="14" fill="#059669" stroke="#34D399" stroke-width="2"/>
      <circle cx="85" cy="60" r="14" fill="#059669" stroke="#34D399" stroke-width="2"/>
      <circle cx="0" cy="-95" r="12" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="0" cy="95" r="12" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>

      <!-- Master Neural Center Hub -->
      <circle cx="0" cy="0" r="38" fill="#0284C7" opacity="0.3" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
