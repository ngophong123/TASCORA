<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1E"/>
      <stop offset="50%" stop-color="#0A1D3D"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-dev-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#3B82F6" opacity="0.22" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="140" fill="#10B981" opacity="0.18" filter="url(#glow)"/>

  <!-- Cloud & Infinity CI/CD Loop -->
  <g filter="url(#soft-shadow)" transform="translate(400, 200)">
    <!-- Big Cloud Outline -->
    <path d="M -140 40 C -170 40 -195 15 -195 -15 C -195 -45 -170 -68 -140 -68 C -135 -105 -100 -135 -55 -135 C -20 -135 12 -115 28 -85 C 45 -100 70 -110 95 -110 C 135 -110 170 -80 175 -40 C 200 -35 220 -15 220 15 C 220 45 195 65 165 65 L -140 65 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" opacity="0.95"/>

    <!-- Central Infinity CI/CD Pipeline Loop -->
    <g transform="translate(0, -25)">
      <path d="M 0 0 C -38 -45 -95 -45 -95 0 C -95 45 -38 45 0 0 Z" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
      <path d="M 0 0 C 38 45 95 45 95 0 C 95 -45 38 -45 0 0 Z" fill="none" stroke="#10B981" stroke-width="9" stroke-linecap="round"/>

      <!-- Pipeline Checkpoints -->
      <circle cx="-55" cy="-22" r="6" fill="#FFFFFF"/>
      <circle cx="-55" cy="22" r="6" fill="#FFFFFF"/>
      <circle cx="55" cy="-22" r="6" fill="#FFFFFF"/>
      <circle cx="55" cy="22" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Container Stack Cluster Under Cloud -->
  <g filter="url(#soft-shadow)" transform="translate(260, 310)">
    <rect width="280" height="70" rx="14" fill="#0B132B" stroke="#334155" stroke-width="1.5"/>
    <!-- Docker Container 1 -->
    <rect x="20" y="18" width="65" height="34" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <line x1="41" y1="18" x2="41" y2="52" stroke="#38BDF8" stroke-width="1"/>
    <line x1="62" y1="18" x2="62" y2="52" stroke="#38BDF8" stroke-width="1"/>
    <!-- Container 2 -->
    <rect x="105" y="18" width="65" height="34" rx="6" fill="#2563EB" stroke="#60A5FA" stroke-width="1"/>
    <line x1="126" y1="18" x2="126" y2="52" stroke="#60A5FA" stroke-width="1"/>
    <line x1="147" y1="18" x2="147" y2="52" stroke="#60A5FA" stroke-width="1"/>
    <!-- Container 3 -->
    <rect x="190" y="18" width="65" height="34" rx="6" fill="#059669" stroke="#34D399" stroke-width="1"/>
    <line x1="211" y1="18" x2="211" y2="52" stroke="#34D399" stroke-width="1"/>
    <line x1="232" y1="18" x2="232" y2="52" stroke="#34D399" stroke-width="1"/>
  </g>
</svg>
