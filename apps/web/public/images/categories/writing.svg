<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-wri-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1F"/>
      <stop offset="50%" stop-color="#0C1D38"/>
      <stop offset="100%" stop-color="#0D3547"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-wri-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#06B6D4" opacity="0.2" filter="url(#glow)"/>
  <circle cx="220" cy="180" r="140" fill="#3B82F6" opacity="0.2" filter="url(#glow)"/>

  <!-- Documentation Book / Writing Workspace Central -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Topbar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Two-Page Open Documentation Book Graphic -->
    <g transform="translate(50, 75)">
      <!-- Left Page -->
      <rect x="0" y="0" width="165" height="225" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="18" y="20" width="80" height="10" rx="5" fill="#38BDF8"/>
      <!-- Paragraph lines -->
      <rect x="18" y="44" width="125" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="58" width="115" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="72" width="130" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="86" width="90" height="6" rx="3" fill="#94A3B8"/>

      <!-- Subheading -->
      <rect x="18" y="112" width="65" height="8" rx="4" fill="#34D399"/>
      <rect x="18" y="130" width="125" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="144" width="120" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="158" width="105" height="6" rx="3" fill="#94A3B8"/>
      <rect x="18" y="172" width="80" height="6" rx="3" fill="#94A3B8"/>

      <!-- Right Page (Code Sample / API Spec) -->
      <rect x="175" y="0" width="165" height="225" rx="8" fill="#09142A" stroke="#1E293B" stroke-width="1"/>
      <rect x="190" y="20" width="65" height="8" rx="4" fill="#C084FC"/>
      <!-- Code Snippet -->
      <rect x="190" y="44" width="40" height="6" rx="3" fill="#F472B6"/>
      <rect x="235" y="44" width="70" height="6" rx="3" fill="#60A5FA"/>
      <rect x="200" y="60" width="55" height="6" rx="3" fill="#38BDF8"/>
      <rect x="260" y="60" width="45" height="6" rx="3" fill="#FCD34D"/>
      <rect x="200" y="76" width="90" height="6" rx="3" fill="#34D399"/>
      <rect x="190" y="94" width="30" height="6" rx="3" fill="#F472B6"/>

      <!-- Response Body Box -->
      <rect x="190" y="125" width="135" height="75" rx="6" fill="#1E293B"/>
      <rect x="200" y="138" width="55" height="5" rx="2.5" fill="#94A3B8"/>
      <rect x="200" y="150" width="100" height="5" rx="2.5" fill="#34D399"/>
      <rect x="200" y="162" width="80" height="5" rx="2.5" fill="#34D399"/>
      <rect x="200" y="174" width="40" height="5" rx="2.5" fill="#94A3B8"/>
    </g>

    <!-- Fountain Pen Nib -->
    <g transform="translate(370, 70) rotate(35)">
      <path d="M 0 0 L 16 35 L 0 50 L -16 35 Z" fill="#E2E8F0"/>
      <path d="M -16 35 L 16 35 L 0 50 Z" fill="#94A3B8"/>
      <line x1="0" y1="20" x2="0" y2="48" stroke="#0F172A" stroke-width="1.8"/>
      <circle cx="0" cy="20" r="3.5" fill="#0F172A"/>
      <rect x="-14" y="-35" width="28" height="35" rx="2" fill="#0284C7"/>
    </g>
  </g>
</svg>
