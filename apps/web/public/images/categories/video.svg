<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-vid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08081B"/>
      <stop offset="50%" stop-color="#141436"/>
      <stop offset="100%" stop-color="#251747"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-vid-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#818CF8" opacity="0.22" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="140" fill="#C084FC" opacity="0.18" filter="url(#glow)"/>

  <!-- Film Clapper & Video Player Window -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Topbar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Central Play Screen Frame -->
    <g transform="translate(45, 65)">
      <rect width="350" height="175" rx="14" fill="#09142A" stroke="#1E293B" stroke-width="1"/>

      <!-- Film Strip Perforations Top & Bottom -->
      <g fill="#1E293B">
        <rect x="15" y="10" width="16" height="12" rx="3"/><rect x="45" y="10" width="16" height="12" rx="3"/>
        <rect x="75" y="10" width="16" height="12" rx="3"/><rect x="105" y="10" width="16" height="12" rx="3"/>
        <rect x="135" y="10" width="16" height="12" rx="3"/><rect x="165" y="10" width="16" height="12" rx="3"/>
        <rect x="195" y="10" width="16" height="12" rx="3"/><rect x="225" y="10" width="16" height="12" rx="3"/>
        <rect x="255" y="10" width="16" height="12" rx="3"/><rect x="285" y="10" width="16" height="12" rx="3"/>
        <rect x="315" y="10" width="16" height="12" rx="3"/>
      </g>

      <!-- Central Big Glass Play Button -->
      <g transform="translate(175, 95)">
        <circle cx="0" cy="0" r="34" fill="#2563EB" opacity="0.3" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="28" fill="#4F46E5" stroke="#818CF8" stroke-width="2"/>
        <polygon points="-8,-14 14,0 -8,14" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Keyframe Timeline Track -->
    <g transform="translate(45, 260)">
      <rect width="350" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <line x1="20" y1="24" x2="330" y2="24" stroke="#475569" stroke-width="2"/>
      <polygon points="50,24 55,19 60,24 55,29" fill="#38BDF8"/>
      <polygon points="120,24 125,19 130,24 125,29" fill="#A855F7"/>
      <polygon points="210,24 215,19 220,24 215,29" fill="#F472B6"/>
      <polygon points="290,24 295,19 300,24 295,29" fill="#38BDF8"/>
      <!-- Playhead -->
      <line x1="160" y1="10" x2="160" y2="38" stroke="#EF4444" stroke-width="2"/>
    </g>
  </g>
</svg>
