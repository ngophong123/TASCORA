<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#141738"/>
      <stop offset="100%" stop-color="#2D1537"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-brand-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#EC4899" opacity="0.2" filter="url(#glow)"/>
  <circle cx="220" cy="180" r="140" fill="#818CF8" opacity="0.2" filter="url(#glow)"/>

  <!-- Brand Identity Central Geometric Mark & Guidelines -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Topbar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Concentric Golden Ratio Construction Circles -->
    <g transform="translate(220, 160)" opacity="0.4" stroke="#F472B6" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
      <circle cx="0" cy="0" r="85"/>
      <circle cx="0" cy="0" r="52"/>
      <circle cx="0" cy="0" r="32"/>
      <line x1="-120" y1="0" x2="120" y2="0"/>
      <line x1="0" y1="-100" x2="0" y2="100"/>
    </g>

    <!-- Stylized Geometric Brand Emblem (Diamond / Origami Star) -->
    <g transform="translate(220, 160)">
      <polygon points="0,-75 55,-20 0,0 -55,-20" fill="#818CF8"/>
      <polygon points="0,0 55,-20 75,35 0,15" fill="#C084FC"/>
      <polygon points="-55,-20 0,0 0,15 -75,35" fill="#38BDF8"/>
      <polygon points="0,15 75,35 0,75 -75,35" fill="#EC4899"/>
      <!-- Inner Core -->
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Brand Color Specimen Swatches -->
    <g transform="translate(45, 270)">
      <rect x="0" y="0" width="75" height="28" rx="7" fill="#818CF8"/>
      <rect x="90" y="0" width="75" height="28" rx="7" fill="#C084FC"/>
      <rect x="180" y="0" width="75" height="28" rx="7" fill="#38BDF8"/>
      <rect x="270" y="0" width="75" height="28" rx="7" fill="#EC4899"/>
    </g>
  </g>
</svg>
