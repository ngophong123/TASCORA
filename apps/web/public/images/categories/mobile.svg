<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-mob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1F"/>
      <stop offset="50%" stop-color="#0C1F3D"/>
      <stop offset="100%" stop-color="#0F3854"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-mob-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#38BDF8" opacity="0.22" filter="url(#glow)"/>
  <circle cx="220" cy="180" r="140" fill="#3B82F6" opacity="0.18" filter="url(#glow)"/>

  <!-- Mobile Devices Central -->
  <g filter="url(#soft-shadow)" transform="translate(300, 60)">
    <!-- Primary Phone -->
    <rect width="200" height="370" rx="32" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="10" y="10" width="180" height="350" rx="24" fill="#09142A"/>

    <!-- Dynamic Island -->
    <rect x="68" y="18" width="64" height="16" rx="8" fill="#000000"/>
    <circle cx="118" cy="26" r="3" fill="#1E293B"/>

    <!-- App Card inside Mobile -->
    <g transform="translate(24, 55)">
      <rect width="152" height="85" rx="12" fill="#0284C7"/>
      <rect x="14" y="16" width="65" height="7" rx="3.5" fill="#FFFFFF"/>
      <rect x="14" y="28" width="95" height="5" rx="2.5" fill="#BAE6FD"/>
      <circle cx="120" cy="55" r="14" fill="#FFFFFF" opacity="0.2"/>
    </g>

    <!-- App Widget Icons -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#1E293B"/>
      <circle cx="16" cy="16" r="5" fill="#38BDF8"/>
      <rect x="40" y="0" width="32" height="32" rx="8" fill="#1E293B"/>
      <circle cx="56" cy="16" r="5" fill="#818CF8"/>
      <rect x="80" y="0" width="32" height="32" rx="8" fill="#1E293B"/>
      <circle cx="96" cy="16" r="5" fill="#34D399"/>
      <rect x="120" y="0" width="32" height="32" rx="8" fill="#1E293B"/>
      <circle cx="136" cy="16" r="5" fill="#F472B6"/>
    </g>

    <!-- Feed Cards -->
    <g transform="translate(24, 210)">
      <rect x="0" y="0" width="152" height="32" rx="8" fill="#1E293B"/>
      <circle cx="16" cy="16" r="6" fill="#2563EB"/>
      <rect x="30" y="12" width="65" height="5" rx="2.5" fill="#E2E8F0"/>

      <rect x="0" y="40" width="152" height="32" rx="8" fill="#1E293B"/>
      <circle cx="16" cy="56" r="6" fill="#7C3AED"/>
      <rect x="30" y="52" width="55" height="5" rx="2.5" fill="#E2E8F0"/>
    </g>

    <!-- Bottom Bar -->
    <g transform="translate(24, 310)">
      <rect width="152" height="36" rx="12" fill="#030712"/>
      <circle cx="28" cy="18" r="4.5" fill="#38BDF8"/>
      <circle cx="64" cy="18" r="4" fill="#64748B"/>
      <circle cx="100" cy="18" r="4" fill="#64748B"/>
      <circle cx="130" cy="18" r="4" fill="#64748B"/>
    </g>
  </g>
</svg>
