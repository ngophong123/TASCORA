<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-bus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-bus-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#3B82F6" opacity="0.22" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="150" fill="#F59E0B" opacity="0.18" filter="url(#glow)"/>

  <!-- Business Executive Strategy Frame -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Topbar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Central Briefcase & Strategic Roadmap Graphic -->
    <g transform="translate(145, 65)">
      <!-- Briefcase Handle -->
      <path d="M 45 30 L 45 10 C 45 5 105 5 105 10 L 105 30" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
      <!-- Briefcase Body -->
      <rect x="0" y="30" width="150" height="105" rx="14" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
      <!-- Briefcase Flap / Strap -->
      <rect x="0" y="30" width="150" height="40" rx="10" fill="#1D4ED8"/>
      <rect x="65" y="60" width="20" height="18" rx="4" fill="#FCD34D"/>
      <circle cx="75" cy="69" r="2.5" fill="#92400E"/>
    </g>

    <!-- Strategy Milestones & Roadmap Nodes -->
    <g transform="translate(50, 220)">
      <!-- Roadmap Track Line -->
      <line x1="30" y1="30" x2="310" y2="30" stroke="#334155" stroke-width="3"/>

      <!-- Milestone 1 -->
      <circle cx="50" cy="30" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
      <circle cx="50" cy="30" r="5" fill="#34D399"/>
      <rect x="25" y="55" width="50" height="6" rx="3" fill="#A7F3D0"/>

      <!-- Milestone 2 -->
      <circle cx="130" cy="30" r="14" fill="#0C2540" stroke="#0284C7" stroke-width="2"/>
      <circle cx="130" cy="30" r="5" fill="#38BDF8"/>
      <rect x="105" y="55" width="50" height="6" rx="3" fill="#BAE6FD"/>

      <!-- Milestone 3 -->
      <circle cx="210" cy="30" r="14" fill="#1E1B4B" stroke="#7C3AED" stroke-width="2"/>
      <circle cx="210" cy="30" r="5" fill="#C084FC"/>
      <rect x="185" y="55" width="50" height="6" rx="3" fill="#DDD6FE"/>

      <!-- Milestone 4 (Target) -->
      <circle cx="290" cy="30" r="14" fill="#78350F" stroke="#D97706" stroke-width="2"/>
      <circle cx="290" cy="30" r="5" fill="#FBBF24"/>
      <rect x="265" y="55" width="50" height="6" rx="3" fill="#FDE68A"/>
    </g>
  </g>
</svg>
