<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-mkt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1B"/>
      <stop offset="50%" stop-color="#0B1A34"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-mkt-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#10B981" opacity="0.2" filter="url(#glow)"/>
  <circle cx="220" cy="180" r="140" fill="#38BDF8" opacity="0.2" filter="url(#glow)"/>

  <!-- Marketing Growth Dashboard Frame -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Topbar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Bar Chart + Trendline Graphic -->
    <g transform="translate(50, 75)">
      <rect width="340" height="165" rx="12" fill="#09142A" stroke="#1E293B" stroke-width="1"/>
      <!-- Grid lines -->
      <line x1="20" y1="40" x2="320" y2="40" stroke="#1E293B" stroke-width="1"/>
      <line x1="20" y1="80" x2="320" y2="80" stroke="#1E293B" stroke-width="1"/>
      <line x1="20" y1="120" x2="320" y2="120" stroke="#1E293B" stroke-width="1"/>

      <!-- Bars -->
      <rect x="40" y="100" width="22" height="45" rx="4" fill="#1E3A8A"/>
      <rect x="80" y="85" width="22" height="60" rx="4" fill="#1E3A8A"/>
      <rect x="120" y="70" width="22" height="75" rx="4" fill="#1E3A8A"/>
      <rect x="160" y="55" width="22" height="90" rx="4" fill="#0284C7"/>
      <rect x="200" y="45" width="22" height="100" rx="4" fill="#0284C7"/>
      <rect x="240" y="30" width="22" height="115" rx="4" fill="#10B981"/>
      <rect x="280" y="15" width="22" height="130" rx="4" fill="#34D399"/>

      <!-- Growth Curve -->
      <path d="M 40 100 C 100 90 160 65 290 15" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="290" cy="15" r="5.5" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- Marketing Metrics Row Footer -->
    <g transform="translate(50, 260)">
      <rect x="0" y="0" width="105" height="45" rx="8" fill="#1E293B"/>
      <rect x="12" y="12" width="45" height="6" rx="3" fill="#94A3B8"/>
      <rect x="12" y="24" width="65" height="10" rx="3" fill="#34D399"/>

      <rect x="118" y="0" width="105" height="45" rx="8" fill="#1E293B"/>
      <rect x="130" y="12" width="50" height="6" rx="3" fill="#94A3B8"/>
      <rect x="130" y="24" width="70" height="10" rx="3" fill="#38BDF8"/>

      <rect x="235" y="0" width="105" height="45" rx="8" fill="#1E293B"/>
      <rect x="247" y="12" width="40" height="6" rx="3" fill="#94A3B8"/>
      <rect x="247" y="24" width="55" height="10" rx="3" fill="#60A5FA"/>
    </g>
  </g>
</svg>
