<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cat-prog-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1B"/>
      <stop offset="50%" stop-color="#0B1A38"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cat-prog-bg)"/>
  <circle cx="400" cy="250" r="180" fill="#2563EB" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="140" fill="#38BDF8" opacity="0.18" filter="url(#glow)"/>

  <!-- Code Frame Central Illustration -->
  <g filter="url(#soft-shadow)" transform="translate(180, 80)">
    <rect width="440" height="340" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.8" opacity="0.96"/>
    <!-- Titlebar -->
    <rect width="440" height="42" rx="20" fill="#1E293B"/>
    <rect y="22" width="440" height="20" fill="#1E293B"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#334155" stroke-width="1"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <rect x="85" y="14" width="120" height="16" rx="4" fill="#09142A"/>
    <rect x="98" y="19" width="80" height="6" rx="3" fill="#94A3B8"/>

    <!-- Central Code Symbolism -->
    <g transform="translate(70, 70)">
      <!-- Left Angle Bracket < -->
      <path d="M 60 40 L 15 90 L 60 140" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Slash / -->
      <line x1="165" y1="25" x2="135" y2="155" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
      <!-- Right Angle Bracket > -->
      <path d="M 240 40 L 285 90 L 240 140" fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Syntax Highlight Line Bars in Lower Panel -->
    <g transform="translate(45, 255)">
      <rect x="0" y="0" width="70" height="8" rx="4" fill="#C084FC"/>
      <rect x="80" y="0" width="120" height="8" rx="4" fill="#38BDF8"/>
      <rect x="210" y="0" width="60" height="8" rx="4" fill="#94A3B8"/>

      <rect x="20" y="18" width="90" height="8" rx="4" fill="#F472B6"/>
      <rect x="120" y="18" width="150" height="8" rx="4" fill="#60A5FA"/>

      <rect x="0" y="36" width="40" height="8" rx="4" fill="#C084FC"/>
    </g>
  </g>
</svg>
